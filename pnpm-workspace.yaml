packages:
  - apps/*
  - packages/*

allowBuilds:
  # Prebuilt binaries ship via optionalDependencies; the build script is only
  # a node-gyp fallback and the watcher is only used by `tailwindcss --watch`.
  "@parcel/watcher": false
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - lightningcss
  - sharp
  - unrs-resolver

ignoredBuiltDependencies:
  - "@parcel/watcher"

minimumReleaseAgeExclude:
  - cnfast@0.0.8
  - "@oxlint-tsgolint/darwin-arm64@7.0.2001"
  - "@oxlint-tsgolint/darwin-x64@7.0.2001"
  - "@oxlint-tsgolint/linux-arm64@7.0.2001"
  - "@oxlint-tsgolint/linux-x64@7.0.2001"
  - "@oxlint-tsgolint/win32-arm64@7.0.2001"
  - "@oxlint-tsgolint/win32-x64@7.0.2001"
  - oxlint-tsgolint@7.0.2001
  - oxlint-config-awesomeness@3.2.0
