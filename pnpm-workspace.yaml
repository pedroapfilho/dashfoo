packages:
  - apps/*
  - packages/*

allowBuilds:
  # Prebuilt binaries ship via optionalDependencies; the build script is only
  # a node-gyp fallback and the watcher is only used by `tailwindcss --watch`.
  "@parcel/watcher": false
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - lightningcss
  - sharp
  - unrs-resolver

ignoredBuiltDependencies:
  - "@parcel/watcher"

minimumReleaseAgeExclude:
  - cnfast@0.0.8
