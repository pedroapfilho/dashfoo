name: Publish Checks
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
      - name: Restore Turbo task cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-push-main-
      - run: pnpm exec changeset status
      - run: pnpm typecheck
      - run: pnpm build --filter="./packages/*"
      # Packaging hygiene for the published packages (ESM-only, "use client").
      - name: publint
        run: for pkg in core react theme; do (cd "packages/$pkg" && pnpm dlx publint --strict); done
      - name: are-the-types-wrong
        run: |
          (cd packages/core && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only)
          (cd packages/react && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only)
          # dashfoo.css, tailwind.css, and tokens.css are CSS-only exports with no types/JS for attw to resolve.
          (cd packages/theme && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only --exclude-entrypoints ./dashfoo.css ./tailwind.css ./tokens.css)
      - run: pnpm exec playwright install --with-deps chromium
      - name: Standalone consumers (React 18 and 19, npm and pnpm)
        run: pnpm test:consumers
