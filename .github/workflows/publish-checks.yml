name: Publish Checks
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
      - run: pnpm typecheck
      - run: pnpm build
      # Packaging hygiene for the published packages (ESM-only, "use client").
      - name: publint
        run: for pkg in core react theme; do (cd "packages/$pkg" && pnpm dlx publint --strict); done
      - name: are-the-types-wrong
        run: |
          (cd packages/core && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only)
          (cd packages/react && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only)
          # dashfoo.css, tailwind.css, and tokens.css are CSS-only exports with no types/JS for attw to resolve.
          (cd packages/theme && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only --exclude-entrypoints ./dashfoo.css ./tailwind.css ./tokens.css)
