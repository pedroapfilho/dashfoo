# Written by `standy sync` from the library template and `.github/ci/policy.json`. Change those, never this file.
name: Publish Checks
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 15 4 * * 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan validation
        id: plan
        run: node .github/ci/ci.mjs plan packaging
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
      - name: Restore Turbo task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-${{ github.event.pull_request.number || github.ref_name }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-main-
      - run: node .github/ci/ci.mjs run packaging -- pnpm build:packages
      # Derived rather than listed: a package copied from packages/core is
      # checked without editing this workflow.
      - name: Discover publishable packages
        run: |
          set -euo pipefail
          dirs=$(jq -rn '[inputs | select(.private != true) | input_filename | rtrimstr("/package.json")] | join(" ")' packages/*/package.json)
          if [ -z "$dirs" ]; then
            echo "::error::found no publishable package under packages/"
            exit 1
          fi
          echo "publishable: $dirs"
          echo "PUBLISHABLE_PACKAGES=$dirs" >> "$GITHUB_ENV"
      # Packaging hygiene for the published packages (ESM-only).
      - name: publint
        run: node .github/ci/ci.mjs run packaging -- bash -e -o pipefail -c 'for dir in $PUBLISHABLE_PACKAGES; do (cd "$dir" && pnpm dlx publint --strict); done'
      - name: are-the-types-wrong
        run: node .github/ci/ci.mjs run packaging -- bash -e -o pipefail -c 'for dir in $PUBLISHABLE_PACKAGES; do (cd "$dir" && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only); done'
      - name: Require a changeset outside the version pull request
        if: ${{ !cancelled() }}
        run: '[ "$GITHUB_REF_NAME" = changeset-release/main ] || [ "$GITHUB_HEAD_REF" = changeset-release/main ] || pnpm exec changeset status --since=origin/main'
      - if: ${{ !cancelled() }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Standalone consumers (React 18 and 19, npm and pnpm)
        if: ${{ !cancelled() }}
        run: pnpm test:consumers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload CI evidence
        if: ${{ !cancelled() }}
        with:
          name: ci-execution-${{ github.workflow }}-${{ github.job }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
