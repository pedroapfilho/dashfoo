name: Publish Checks
on:
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
  schedule:
    - cron: 17 4 * * 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan validation
        id: plan
        run: node .github/ci/ci.mjs plan packaging
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
      - name: Restore Turbo task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-${{ github.event.pull_request.number || github.ref_name }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-main-
      - if: github.ref_name != 'changeset-release/main' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/main
      - run: node .github/ci/ci.mjs run packaging -- pnpm build --filter="./packages/*"
      # Packaging hygiene for the published packages (ESM-only, "use client").
      - name: publint
        run: node .github/ci/ci.mjs run packaging -- bash -e -o pipefail -c 'for pkg in core react theme; do (cd "packages/$pkg" && pnpm dlx publint --strict); done'
      - name: are-the-types-wrong
        run: |-
          node .github/ci/ci.mjs run packaging -- bash -e -o pipefail -c '(cd packages/core && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only)
          (cd packages/react && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only)
          # dashfoo.css, tailwind.css, and tokens.css are CSS-only exports with no types/JS for attw to resolve.
          (cd packages/theme && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only --exclude-entrypoints ./dashfoo.css ./tailwind.css ./tokens.css)
          '
      - run: pnpm exec playwright install --with-deps chromium
      - name: Standalone consumers (React 18 and 19, npm and pnpm)
        run: pnpm test:consumers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload CI evidence
        if: ${{ !cancelled() }}
        with:
          name: ci-execution-${{ github.workflow }}-${{ github.job }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
