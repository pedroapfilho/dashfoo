name: Fallow
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          runtime: node@24
          cache: true
      # Dead-code analysis resolves workspace imports through built dist output,
      # which no longer exists after a bare install. Mirrors .github/workflows/lint.yml.
      - run: pnpm build --filter="./packages/*"
      - run: pnpm fallow:dead
