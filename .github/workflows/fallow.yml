name: Fallow
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
      # Dead-code analysis resolves workspace imports through built dist output,
      # which no longer exists after a bare install. Mirrors .github/workflows/lint.yml.
      - run: pnpm build --filter="./packages/*"
      - run: pnpm fallow:dead
