<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dashfoo · Vite demo</title>
    <script>
      // Apply the theme before first paint so a dark preference never flashes
      // light. The React toggle in root.tsx owns it from there.
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("dashfoo:demo:theme");
        } catch {
          // storage unavailable — fall through to the system preference
        }
        const dark = stored
          ? stored === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          document.documentElement.dataset.dashfooTheme = "dark";
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
